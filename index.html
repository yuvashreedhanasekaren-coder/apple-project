<!DOCTYPE html>
<html>
<head>

<title>Realistic Apple - Cut & Bounce</title>

<style>

body{
    margin:0;
    height:100vh;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
    overflow:hidden;
}

/* Main area */
.apple-container{
    width:320px;
    height:390px;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* Apple pieces */
#apple{
    width:260px;
    position:absolute;
    z-index:3;
    overflow:visible;
    cursor:pointer;
}

.apple-piece{
    transform-box:fill-box;
    transform-origin:center;
}

.left-piece{
    clip-path:url(#leftClip);
}

.right-piece{
    clip-path:url(#rightClip);
}

/* Bounce before the cut */
.apple-bounce{
    animation:appleBounce 0.7s cubic-bezier(.25,.8,.25,1);
}

@keyframes appleBounce{
    0%{
        transform:translateY(0) scaleX(1) scaleY(1);
    }

    25%{
        transform:translateY(-18px) scaleX(.99) scaleY(1.01);
    }

    55%{
        transform:translateY(-4px) scaleX(1) scaleY(1);
    }

    72%{
        transform:translateY(3px) scaleX(1.015) scaleY(.985);
    }

    100%{
        transform:translateY(0) scaleX(1) scaleY(1);
    }
}

/* After the cut, the two halves separate */
.cut-left{
    animation:cutLeft .65s .35s cubic-bezier(.2,.8,.2,1) forwards;
}

.cut-right{
    animation:cutRight .65s .35s cubic-bezier(.2,.8,.2,1) forwards;
}

@keyframes cutLeft{
    from{ transform:translateX(0) rotate(0deg); }
    to{ transform:translateX(-28px) rotate(-4deg); }
}

@keyframes cutRight{
    from{ transform:translateX(0) rotate(0deg); }
    to{ transform:translateX(28px) rotate(4deg); }
}

/* Cutting knife */
#knife{
    position:absolute;
    width:190px;
    height:190px;
    left:65px;
    top:45px;
    z-index:5;
    pointer-events:none;
    opacity:0;
    transform:translateX(-190px) rotate(-24deg);
}

/* Knife appears and sweeps across the apple */
.knife-cut{
    animation:knifeCut .55s cubic-bezier(.45,0,.55,1) forwards;
}

@keyframes knifeCut{
    0%{
        opacity:0;
        transform:translateX(-190px) rotate(-24deg);
    }

    15%{
        opacity:1;
    }

    65%{
        opacity:1;
        transform:translateX(95px) rotate(-24deg);
    }

    100%{
        opacity:0;
        transform:translateX(150px) rotate(-24deg);
    }
}

/* Shadow */
#shadow{
    position:absolute;
    width:130px;
    height:30px;
    background:black;
    opacity:.15;
    border-radius:50%;
    bottom:25px;
    filter:blur(3px);
    z-index:1;
}

.shadow-bounce{
    animation:shadowBounce .7s cubic-bezier(.25,.8,.25,1);
}

@keyframes shadowBounce{
    0%{
        transform:scaleX(1);
        opacity:.15;
    }

    25%{
        transform:scaleX(.72);
        opacity:.08;
    }

    55%{
        transform:scaleX(.92);
        opacity:.12;
    }

    72%{
        transform:scaleX(1.08);
        opacity:.17;
    }

    100%{
        transform:scaleX(1);
        opacity:.15;
    }
}

/* Small cut line */
#cut-line{
    position:absolute;
    width:5px;
    height:285px;
    border-radius:50%;
    background:linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,.95) 25%,
        rgba(255,245,230,1) 50%,
        rgba(255,255,255,.95) 75%,
        rgba(255,255,255,0)
    );
    left:calc(50% - 2px);
    top:65px;
    z-index:4;
    opacity:0;
    transform:rotate(4deg) scaleY(.2);
    pointer-events:none;
}

.show-cut{
    animation:showCut .7s .28s ease-out forwards;
}

@keyframes showCut{
    0%{
        opacity:0;
        transform:rotate(4deg) scaleY(.2);
    }

    35%{
        opacity:.9;
        transform:rotate(4deg) scaleY(1);
    }

    100%{
        opacity:0;
        transform:rotate(4deg) scaleY(1);
    }
}

/* Hint */
#hint{
    position:absolute;
    bottom:-5px;
    font-size:14px;
    color:#777;
    letter-spacing:.3px;
    opacity:.8;
    transition:opacity .3s ease, transform .3s ease;
}

#hint.hide{
    opacity:0;
    transform:translateY(5px);
}

#reset-hint{
    position:absolute;
    bottom:-28px;
    font-size:12px;
    color:#999;
    opacity:0;
    transition:opacity .3s ease;
}

#reset-hint.show{
    opacity:1;
}

</style>
</head>

<body>

<div class="apple-container">

    <div id="shadow"></div>

    <!-- Apple -->
    <svg id="apple" viewBox="0 0 500 600">

        <defs>

            <radialGradient id="appleGrad" cx="35%" cy="28%" r="70%">
                <stop offset="0%" stop-color="#ffd6b3"/>
                <stop offset="25%" stop-color="#ff3b2f"/>
                <stop offset="60%" stop-color="#d40000"/>
                <stop offset="100%" stop-color="#7a0000"/>
            </radialGradient>

            <radialGradient id="shineGrad">
                <stop offset="0%" stop-color="white" stop-opacity=".95"/>
                <stop offset="100%" stop-color="white" stop-opacity="0"/>
            </radialGradient>

            <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#7ed957"/>
                <stop offset="100%" stop-color="#145a22"/>
            </linearGradient>

            <!-- Left and right halves -->
            <clipPath id="leftClip">
                <rect x="0" y="0" width="247" height="600"/>
            </clipPath>

            <clipPath id="rightClip">
                <rect x="253" y="0" width="247" height="600"/>
            </clipPath>

        </defs>

        <!-- LEFT HALF -->
        <g id="leftPiece" class="apple-piece left-piece">

            <path d="
                M250 170
                C170 140 110 240 130 340
                C150 430 200 470 250 470
                C300 470 350 430 370 340
                C390 240 330 140 250 170 Z"
                fill="url(#appleGrad)"
            />

            <ellipse cx="200" cy="280" rx="60" ry="110"
                     fill="url(#shineGrad)"/>

            <path d="
                M245 120
                C240 100 260 90 270 110
                C280 130 260 160 250 170"
                fill="#5a3a1b"
            />

            <path d="
                M270 120
                C340 70 420 140 360 200
                C310 240 270 190 270 120 Z"
                fill="url(#leafGrad)"
            />

            <path d="
                M270 120
                C330 150 350 170 360 200"
                stroke="#0e3d16" stroke-width="2" fill="none"
            />

            <path d="
                M300 135
                C330 145 345 160 355 180"
                stroke="#0e3d16" stroke-width="1" fill="none"
            />

        </g>

        <!-- RIGHT HALF -->
        <g id="rightPiece" class="apple-piece right-piece">

            <path d="
                M250 170
                C170 140 110 240 130 340
                C150 430 200 470 250 470
                C300 470 350 430 370 340
                C390 240 330 140 250 170 Z"
                fill="url(#appleGrad)"
            />

            <ellipse cx="200" cy="280" rx="60" ry="110"
                     fill="url(#shineGrad)"/>

            <path d="
                M245 120
                C240 100 260 90 270 110
                C280 130 260 160 250 170"
                fill="#5a3a1b"
            />

            <path d="
                M270 120
                C340 70 420 140 360 200
                C310 240 270 190 270 120 Z"
                fill="url(#leafGrad)"
            />

            <path d="
                M270 120
                C330 150 350 170 360 200"
                stroke="#0e3d16" stroke-width="2" fill="none"
            />

            <path d="
                M300 135
                C330 145 345 160 355 180"
                stroke="#0e3d16" stroke-width="1" fill="none"
            />

        </g>

    </svg>

    <!-- Cut line -->
    <div id="cut-line"></div>

    <!-- Knife -->
    <svg id="knife" viewBox="0 0 200 200">
        <g transform="rotate(-8 100 100)">
            <rect x="104" y="28" width="22" height="130" rx="7"
                  fill="#303030"/>
            <path d="M104 30 L126 30 L185 92 L126 103 Z"
                  fill="#d9dde2"/>
            <path d="M126 103 L185 92 L126 112 Z"
                  fill="#ffffff"/>
            <rect x="105" y="145" width="20" height="42" rx="8"
                  fill="#6b3f22"/>
        </g>
    </svg>

    <div id="hint">🍎 Click the apple to cut</div>
    <div id="reset-hint">Click again to reset</div>

</div>

<script>

const apple = document.getElementById("apple");
const leftPiece = document.getElementById("leftPiece");
const rightPiece = document.getElementById("rightPiece");
const shadow = document.getElementById("shadow");
const knife = document.getElementById("knife");
const cutLine = document.getElementById("cut-line");
const hint = document.getElementById("hint");
const resetHint = document.getElementById("reset-hint");

let isCut = false;

function restartAnimation(element, className){
    element.classList.remove(className);
    void element.offsetWidth;
    element.classList.add(className);
}

apple.addEventListener("click", () => {

    if(isCut){
        // Reset for another cut
        isCut = false;

        leftPiece.classList.remove("cut-left");
        rightPiece.classList.remove("cut-right");
        restartAnimation(leftPiece, "apple-bounce");
        restartAnimation(rightPiece, "apple-bounce");

        resetHint.classList.remove("show");
        hint.textContent = "🍎 Click the apple to cut";
        return;
    }

    isCut = true;

    // Hide first hint
    hint.classList.add("hide");

    // Bounce
    restartAnimation(leftPiece, "apple-bounce");
    restartAnimation(rightPiece, "apple-bounce");
    restartAnimation(shadow, "shadow-bounce");

    // Knife + cutting line
    restartAnimation(knife, "knife-cut");
    restartAnimation(cutLine, "show-cut");

    // Split after the knife passes
    setTimeout(() => {
        leftPiece.classList.add("cut-left");
        rightPiece.classList.add("cut-right");
        resetHint.classList.add("show");
    }, 100);

});

</script>

</body>
</html>
