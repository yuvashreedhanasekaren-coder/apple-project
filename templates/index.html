<!DOCTYPE html>
<html>
<head>

<title>Realistic Apple</title>

<style>

body{
    margin:0;
    height:100vh;
    background:white;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial, sans-serif;
}


/* Main area */

.apple-container{

    width:260px;
    height:360px;

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;

    cursor:pointer;
}


/* Apple */

#apple{

    width:260px;

    position:absolute;

    z-index:2;

}


/* Shadow */

#shadow{

    position:absolute;

    width:130px;
    height:30px;

    background:black;

    opacity:0.15;

    border-radius:50%;

    bottom:25px;

    filter:blur(3px);

    z-index:1;
}


/* Hint */

#hint{

    position:absolute;

    bottom:-5px;

    font-size:14px;

    color:#777;

    letter-spacing:0.3px;

    opacity:0.8;

    transition:
        opacity 0.3s ease,
        transform 0.3s ease;

}


/* Hide hint after click */

#hint.hide{

    opacity:0;

    transform:translateY(5px);

}


/* Apple movement */

.apple-move{

    animation:
        appleBounce
        0.7s
        cubic-bezier(.25,.8,.25,1);

}


/* Shadow movement */

.shadow-move{

    animation:
        shadowBounce
        0.7s
        cubic-bezier(.25,.8,.25,1);

}


/* Apple animation */

@keyframes appleBounce{

    0%{

        transform:
            translateY(0)
            scaleX(1)
            scaleY(1);

    }

    25%{

        transform:
            translateY(-18px)
            scaleX(0.99)
            scaleY(1.01);

    }

    55%{

        transform:
            translateY(-4px)
            scaleX(1)
            scaleY(1);

    }

    72%{

        transform:
            translateY(3px)
            scaleX(1.015)
            scaleY(0.985);

    }

    100%{

        transform:
            translateY(0)
            scaleX(1)
            scaleY(1);

    }

}


/* Shadow animation */

@keyframes shadowBounce{

    0%{

        transform:scaleX(1);

        opacity:0.15;

    }

    25%{

        transform:scaleX(0.72);

        opacity:0.08;

    }

    55%{

        transform:scaleX(0.92);

        opacity:0.12;

    }

    72%{

        transform:scaleX(1.08);

        opacity:0.17;

    }

    100%{

        transform:scaleX(1);

        opacity:0.15;

    }

}

</style>

</head>


<body>


<div class="apple-container">


    <!-- Shadow -->

    <div id="shadow"></div>


    <!-- Apple -->

    <svg
        id="apple"
        viewBox="0 0 500 600"
    >

        <defs>


            <!-- Apple Gradient -->

            <radialGradient
                id="appleGrad"
                cx="35%"
                cy="28%"
                r="70%"
            >

                <stop
                    offset="0%"
                    stop-color="#ffd6b3"
                />

                <stop
                    offset="25%"
                    stop-color="#ff3b2f"
                />

                <stop
                    offset="60%"
                    stop-color="#d40000"
                />

                <stop
                    offset="100%"
                    stop-color="#7a0000"
                />

            </radialGradient>


            <!-- Shine -->

            <radialGradient id="shineGrad">

                <stop
                    offset="0%"
                    stop-color="white"
                    stop-opacity="0.95"
                />

                <stop
                    offset="100%"
                    stop-color="white"
                    stop-opacity="0"
                />

            </radialGradient>


            <!-- Leaf -->

            <linearGradient
                id="leafGrad"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="100%"
            >

                <stop
                    offset="0%"
                    stop-color="#7ed957"
                />

                <stop
                    offset="100%"
                    stop-color="#145a22"
                />

            </linearGradient>

        </defs>


        <!-- Apple Body -->

        <path
            d="
            M250 170
            C170 140 110 240 130 340
            C150 430 200 470 250 470
            C300 470 350 430 370 340
            C390 240 330 140 250 170
            Z
            "
            fill="url(#appleGrad)"
        />


        <!-- Shine -->

        <ellipse
            cx="200"
            cy="280"
            rx="60"
            ry="110"
            fill="url(#shineGrad)"
        />


        <!-- Stem -->

        <path
            d="
            M245 120
            C240 100 260 90 270 110
            C280 130 260 160 250 170
            "
            fill="#5a3a1b"
        />


        <!-- Leaf -->

        <path
            d="
            M270 120
            C340 70 420 140 360 200
            C310 240 270 190 270 120
            Z
            "
            fill="url(#leafGrad)"
        />


        <!-- Leaf Vein -->

        <path
            d="
            M270 120
            C330 150 350 170 360 200
            "
            stroke="#0e3d16"
            stroke-width="2"
            fill="none"
        />


        <path
            d="
            M300 135
            C330 145 345 160 355 180
            "
            stroke="#0e3d16"
            stroke-width="1"
            fill="none"
        />

    </svg>


    <!-- User Hint -->

    <div id="hint">
        🍎 Click the apple
    </div>


</div>


<script>

const apple = document.getElementById("apple");

const shadow = document.getElementById("shadow");

const hint = document.getElementById("hint");


apple.addEventListener("click", () => {


    /* Hide hint */

    hint.classList.add("hide");


    /* Remove previous animation */

    apple.classList.remove("apple-move");

    shadow.classList.remove("shadow-move");


    /* Restart animation */

    void apple.offsetWidth;

    void shadow.offsetWidth;


    /* Start animation */

    apple.classList.add("apple-move");

    shadow.classList.add("shadow-move");

});

</script>


</body>
</html>
