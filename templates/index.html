<!DOCTYPE html>
<html>
<head>
<title>Realistic Apple</title>
<style>
body{
    margin:0;
    height:100vh;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
}
svg{
    width:260px;   /* 👈 size reduced */
}
</style>
</head>
<body>

<svg viewBox="0 0 500 600">

<defs>
<radialGradient id="appleGrad" cx="35%" cy="28%" r="70%">
  <stop offset="0%" stop-color="#ffd6b3"/>
  <stop offset="25%" stop-color="#ff3b2f"/>
  <stop offset="60%" stop-color="#d40000"/>
  <stop offset="100%" stop-color="#7a0000"/>
</radialGradient>

<radialGradient id="shineGrad">
  <stop offset="0%" stop-color="white" stop-opacity="0.95"/>
  <stop offset="100%" stop-color="white" stop-opacity="0"/>
</radialGradient>

<linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#7ed957"/>
  <stop offset="100%" stop-color="#145a22"/>
</linearGradient>
</defs>

<!-- Shadow -->
<ellipse cx="250" cy="500" rx="130" ry="30"
fill="black" opacity="0.15"/>

<!-- Apple Body -->
<path d="
M250 170
C170 140 110 240 130 340
C150 430 200 470 250 470
C300 470 350 430 370 340
C390 240 330 140 250 170
Z"
fill="url(#appleGrad)"/>

<!-- Shine -->
<ellipse cx="200" cy="280" rx="60" ry="110"
fill="url(#shineGrad)"/>

<!-- Stem -->
<path d="
M245 120
C240 100 260 90 270 110
C280 130 260 160 250 170"
fill="#5a3a1b"/>

<!-- Leaf -->
<path d="
M270 120
C340 70 420 140 360 200
C310 240 270 190 270 120
Z"
fill="url(#leafGrad)"/>

<!-- Leaf veins -->
<path d="M270 120 C330 150 350 170 360 200"
stroke="#0e3d16" stroke-width="2" fill="none"/>

<path d="M300 135 C330 145 345 160 355 180"
stroke="#0e3d16" stroke-width="1" fill="none"/>

</svg>

</body>
</html>
